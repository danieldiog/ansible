---
- name: Cria link simbólico home --> /web/shared/home/{{ servico | trim }}
  ansible.builtin.file:
    src: /web/shared/home/{{ servico | trim }}
    dest: /web/shared/servers/{{ servico | trim }}/home
    state: link

- name: Cria link simbólico httpd --> /usr/sbin/httpd
  ansible.builtin.file:
    src: /usr/sbin/httpd
    dest: /web/shared/servers/{{ servico | trim }}/httpd
    state: link 

- name: Cria link simbólico modules --> /usr/lib64/httpd/modules
  ansible.builtin.file:
    src: /usr/lib64/httpd/modules
    dest: /web/shared/servers/{{ servico | trim }}/modules
    state: link

- name: Cria link simbólico pid --> /run/httpd
  ansible.builtin.file:
    src: /run/httpd
    dest: /web/shared/servers/{{ servico | trim }}/pids
    state: link

- name: Cria link simbólico mod_wsgi.so --> /usr/lib64/httpd/modules/mod_wsgi_python3.so
  ansible.builtin.file:
    src: /usr/lib64/httpd/modules/mod_wsgi_python3.so
    dest: /usr/lib64/httpd/modules/mod_wsgi.so
    state: link

- name: Força owner/group do link home como {{ usuario }}
  ansible.builtin.command: chmod -h {{ usuario }}:{{ grupo }} {{ item }}
  loop:
    - /web/shared/servers/{{ servico | trim }}/httpd
    - /web/shared/servers/{{ servico | trim }}/modules
    - /web/shared/servers/{{ servico | trim }}/pids
    - /web/shared/servers/{{ servico | trim }}/home
  changed_when: false
