---
# handlers file for asterisk
- name: StartAsterisk
  ansible.builtin.service:
    name: asterisk
    state: started
    enabled: yes

- name: RebootDoSistema
  ansible.builtin.reboot:

- name: StartPostgresql
  ansible.builtin.service:
    name: postgresql-15
    state: started
    enabled: yes

- name: IniciarApache
  ansible.builtin.service:
    name: httpd 
    state: started
    enabled: yes